<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram UserBot Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .chat-card { transition: all 0.3s; }
        .chat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .status-badge { font-size: 0.8em; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="bi bi-telegram"></i> Telegram UserBot
        </a>
    </div>
</nav>

<div class="container mt-4">
    <!-- Статистика -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 th:text="${stats.totalChats}">0</h5>
                    <p class="text-muted">Total Chats</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 th:text="${stats.activeChats}">0</h5>
                    <p class="text-muted">Active Chats</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 th:text="${stats.totalMessages}">0</h5>
                    <p class="text-muted">Messages</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 th:text="${stats.mediaFiles}">0</h5>
                    <p class="text-muted">Media Files</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Список чатов -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Monitored Chats</h5>
                    <button class="btn btn-sm btn-outline-primary" onclick="loadChats()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                <div class="card-body">
                    <div class="row" id="chats-container">
                        <div th:each="chat : ${chats.chats}" class="col-md-4 mb-3">
                            <div class="card chat-card">
                                <div class="card-body">
                                    <h6 th:text="${chat.title}" class="card-title"></h6>
                                    <p class="card-text">
                                            <span class="badge" th:classappend="${chat.status == 'active'} ? 'bg-success' : 'bg-secondary'"
                                                  th:text="${chat.status}">status</span>
                                        ID: <code th:text="${chat.id}"></code>
                                    </p>
                                    <button class="btn btn-sm btn-primary" th:onclick="'startDump(' + ${chat.id} + ')'">
                                        <i class="bi bi-download"></i> Dump Chat
                                    </button>
                                    <button class="btn btn-sm btn-outline-info ms-1" th:onclick="'viewChat(' + ${chat.id} + ')'">
                                        <i class="bi bi-eye"></i> View
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Логи -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Recent Activity</h5>
                </div>
                <div class="card-body">
                    <div class="console" id="console" style="height: 200px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace;">
                        <div>System started...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = 'http://localhost:7070/api';

    async function loadChats() {
        try {
            const response = await fetch(`${API_BASE}/chats`);
            const data = await response.json();
            updateChatsList(data.chats);
        } catch (error) {
            console.error('Error loading chats:', error);
            addToConsole('Error loading chats: ' + error.message);
        }
    }

    async function startDump(chatId) {
        try {
            addToConsole(`Starting dump for chat ${chatId}...`);
            const response = await fetch(`${API_BASE}/chat/${chatId}/dump`, {
                method: 'POST'
            });
            const result = await response.json();
            addToConsole(`Dump started: ${JSON.stringify(result)}`);
            loadChats(); // Refresh list
        } catch (error) {
            console.error('Error starting dump:', error);
            addToConsole('Error starting dump: ' + error.message);
        }
    }

    function viewChat(chatId) {
        addToConsole(`Viewing chat ${chatId}...`);
        // Здесь можно открыть модальное окно с деталями чата
    }

    function updateChatsList(chats) {
        const container = document.getElementById('chats-container');
        container.innerHTML = chats.map(chat => `
                <div class="col-md-4 mb-3">
                    <div class="card chat-card">
                        <div class="card-body">
                            <h6 class="card-title">${chat.title}</h6>
                            <p class="card-text">
                                <span class="badge ${chat.status === 'active' ? 'bg-success' : 'bg-secondary'}">
                                    ${chat.status}
                                </span>
                                ID: <code>${chat.id}</code>
                            </p>
                            <button class="btn btn-sm btn-primary" onclick="startDump(${chat.id})">
                                <i class="bi bi-download"></i> Dump Chat
                            </button>
                            <button class="btn btn-sm btn-outline-info ms-1" onclick="viewChat(${chat.id})">
                                <i class="bi bi-eye"></i> View
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
    }

    function addToConsole(message) {
        const console = document.getElementById('console');
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        console.appendChild(div);
        console.scrollTop = console.scrollHeight;
    }

    // Авто-обновление каждые 30 секунд
    setInterval(loadChats, 30000);

    // Первоначальная загрузка
    loadChats();
</script>
</body>
</html>
