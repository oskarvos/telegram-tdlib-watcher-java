<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDLib Дамп и Мониторинг Чатов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            padding: 35px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 700;
            font-size: 32px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
            color: #6a11cb;
            font-size: 48px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
        }

        textarea, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            font-size: 15px;
            transition: all 0.3s;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.2);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: #eef2f7;
            transform: translateY(-2px);
        }

        .checkbox-item input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin: 30px 0;
        }

        button {
            flex: 1;
            padding: 16px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #startBtn, #startMonitorBtn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }

        #startBtn:hover, #startMonitorBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(106, 17, 203, 0.4);
        }

        #stopBtn, #stopMonitorBtn {
            background: #ffffff;
            color: #e74c3c;
            border: 2px solid #e74c3c;
        }

        #stopBtn:hover, #stopMonitorBtn:hover {
            background: #e74c3c;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(231, 76, 60, 0.4);
        }

        #showResultsBtn {
            background: #27ae60;
            color: white;
        }

        #showResultsBtn:hover {
            background: #219a52;
            transform: translateY(-3px);
        }

        .progress-container {
            margin-top: 25px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
            color: #2c3e50;
            font-weight: 500;
        }

        #progress, #monitorProgress {
            width: 100%;
            height: 24px;
            background-color: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
        }

        #progress-bar, #monitorProgress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            transition: width 0.5s ease;
            border-radius: 12px;
        }

        #progress-bar.green, #monitorProgress-bar.green {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }

        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
            color: #2c3e50;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            background: #edf7ff;
        }

        .instructions {
            margin-top: 35px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #eef2f7 100%);
            border-radius: 12px;
            font-size: 15px;
            color: #2c3e50;
            border-left: 5px solid #6a11cb;
        }

        .instructions h3 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instructions ul {
            padding-left: 25px;
        }

        .instructions li {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: white;
            font-size: 14px;
            opacity: 0.8;
        }

        .text-document-extensions {
            display: none;
            margin-top: 15px;
        }

        .mode-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-switcher button {
            padding: 12px 20px;
            background: #34495e;
            color: white;
        }

        .mode-switcher button:hover {
            background: #2c3e50;
        }

        .mode-switcher button.active {
            background: #6a11cb;
        }

        .results-container {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-item {
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #6a11cb;
        }

        .interval-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .interval-option {
            padding: 12px 20px;
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .interval-option:hover {
            background: #eef2f7;
            border-color: #6a11cb;
        }

        .interval-option.selected {
            background: #6a11cb;
            color: white;
            border-color: #6a11cb;
        }

        @media (max-width: 768px) {
            .checkbox-group {
                grid-template-columns: repeat(2, 1fr);
            }

            .interval-selector {
                flex-direction: column;
            }
        }

        @media (max-width: 600px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
<div class="mode-switcher">
    <button id="dumpModeBtn" class="active" onclick="showDumpMode()">Режим выгрузки</button>
    <button id="monitorModeBtn" onclick="showMonitorMode()">Режим мониторинга</button>
</div>

<div class="container" id="dumpContainer">
    <div class="logo">
        <i class="fab fa-telegram"></i>
    </div>
    <h1>TDLib Дамп Чатов</h1>

    <div class="form-group">
        <label for="chats">Ссылки или ID чатов (по одному на строку):</label>
        <textarea id="chats" placeholder="Введите ссылки или ID чатов, по одному на строку"></textarea>
    </div>

    <div class="checkbox-group">
        <div class="checkbox-item">
            <input type="checkbox" id="photos" checked>
            <label for="photos">Фотографии</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="videos" checked>
            <label for="videos">Видео</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="links" checked>
            <label for="links">Ссылки</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="messages" checked>
            <label for="messages">Сообщения</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="textDocuments" onclick="toggleTextDocumentExtensions()">
            <label for="textDocuments">Текстовые документы</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="audio" checked>
            <label for="audio">Аудио файлы</label>
        </div>
    </div>

    <div class="text-document-extensions">
        <label for="textExtensions">Введите расширения текстовых документов (через запятую):</label>
        <input type="text" id="textExtensions" placeholder="txt, pdf, docx, java, html" />
    </div>

    <div class="buttons">
        <button id="startBtn" onclick="startDump()">
            <i class="fas fa-play-circle"></i> Начать дамп
        </button>
        <button id="stopBtn" onclick="stopDump()">
            <i class="fas fa-stop-circle"></i> Остановить
        </button>
    </div>

    <div class="progress-container">
        <div class="progress-label">
            <span>Прогресс:</span>
            <span id="progress-value">0%</span>
        </div>
        <div id="progress">
            <div id="progress-bar"></div>
        </div>
        <div class="status" id="status">Готово к началу</div>
    </div>
</div>

<div class="container" id="monitorContainer" style="display: none;">
    <div class="logo">
        <i class="fas fa-search"></i>
    </div>
    <h2>Мониторинг чатов</h2>

    <div class="form-group">
        <label for="monitorChats">Чаты для мониторинга (по одному на строку):</label>
        <textarea id="monitorChats" placeholder="Введите ссылки или ID чатов для мониторинга"></textarea>
    </div>

    <div class="form-group">
        <label for="monitorKeywords">Ключевые слова (по одному на строку):</label>
        <textarea id="monitorKeywords" placeholder="Введите ключевые слова для поиска"></textarea>
    </div>

    <div class="checkbox-group">
        <div class="checkbox-item">
            <input type="checkbox" id="caseSensitive">
            <label for="caseSensitive">Чувствительность к регистру</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="regexMode">
            <label for="regexMode">Регулярные выражения</label>
        </div>
    </div>

    <div class="form-group">
        <label>Интервал проверки:</label>
        <div class="interval-selector">
            <div class="interval-option selected" data-value="1">1 секунда</div>
            <div class="interval-option" data-value="30">30 секунд</div>
            <div class="interval-option" data-value="60">1 минута</div>
            <div class="interval-option" data-value="3600">1 час</div>
        </div>
        <input type="hidden" id="checkInterval" value="1">
    </div>

    <div class="buttons">
        <button id="startMonitorBtn" onclick="startMonitoring()">
            <i class="fas fa-play"></i> Запустить мониторинг
        </button>
        <button id="stopMonitorBtn" onclick="stopMonitoring()">
            <i class="fas fa-stop"></i> Остановить
        </button>
        <button id="showResultsBtn" onclick="showResults()">
            <i class="fas fa-list"></i> Показать результаты
        </button>
    </div>

    <div class="progress-container">
        <div class="progress-label">
            <span>Статус мониторинга:</span>
            <span id="monitorStatusText">Не активен</span>
        </div>
        <div id="monitorProgress">
            <div id="monitorProgress-bar"></div>
        </div>
        <div class="status" id="monitorStatus">Мониторинг не запущен</div>
    </div>

    <div id="monitorResults" class="results-container" style="display: none;">
        <h3>Результаты мониторинга</h3>
        <div id="resultsList"></div>
    </div>
</div>

<div class="footer">
    <p>TDLib Chat Dump & Monitor &copy; 2025</p>
</div>

<script>
    // Переменные для управления интервалами
    let dumpPollInterval = null;
    let monitorPollInterval = null;

    function showDumpMode() {
        document.getElementById('dumpContainer').style.display = 'block';
        document.getElementById('monitorContainer').style.display = 'none';
        document.getElementById('dumpModeBtn').classList.add('active');
        document.getElementById('monitorModeBtn').classList.remove('active');
    }

    function showMonitorMode() {
        document.getElementById('dumpContainer').style.display = 'none';
        document.getElementById('monitorContainer').style.display = 'block';
        document.getElementById('dumpModeBtn').classList.remove('active');
        document.getElementById('monitorModeBtn').classList.add('active');
    }

    // Функции для режима дампа
    function toggleTextDocumentExtensions() {
        const textDocs = document.getElementById('textDocuments');
        const extensionsField = document.querySelector('.text-document-extensions');
        extensionsField.style.display = textDocs.checked ? 'block' : 'none';
    }

    async function startDump() {
        const chats = document.getElementById('chats').value
            .split(/\n+/)
            .map(s => s.trim())
            .filter(Boolean);

        const request = {
            chats: chats,
            photos: document.getElementById('photos').checked,
            videos: document.getElementById('videos').checked,
            links: document.getElementById('links').checked,
            messages: document.getElementById('messages').checked,
            textDocuments: document.getElementById('textDocuments').checked,
            audio: document.getElementById('audio').checked,
            textDocumentExtensions: document.getElementById('textExtensions').value.trim()
        };

        if (request.chats.length === 0) {
            setStatus('Ошибка: не указаны чаты для обработки', '#ffecec', '#e74c3c');
            return;
        }
        if (!request.photos && !request.videos && !request.links &&
            !request.messages && !request.textDocuments && !request.audio) {
            setStatus('Ошибка: не выбран ни один тип контента', '#ffecec', '#e74c3c');
            return;
        }

        document.getElementById('progress-bar').classList.remove('green');
        setStatus('Начинаем процесс дампа...', '#edf7ff', '#2c3e50');
        setProgress(0);

        try {
            const res = await fetch('/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(request)
            });

            if (!res.ok) {
                const errorText = await res.text();
                throw new Error(errorText || 'Сервер вернул ошибку ' + res.status);
            }

            setStatus('Обработка...', '#edf7ff', '#2c3e50');
            // Останавливаем предыдущий интервал, если он был
            if (dumpPollInterval) clearInterval(dumpPollInterval);
            dumpPollInterval = setInterval(pollDumpProgress, 1000);
        } catch (e) {
            setStatus('Ошибка запуска: ' + e.message, '#ffecec', '#e74c3c');
        }
    }

    async function stopDump() {
        setStatus('Останавливаем...', '#fff4e6', '#e67e22');
        try {
            const res = await fetch('/stop', {method: 'POST'});
            if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);
            setStatus('Остановлено', '#ffecec', '#e74c3c');
            if (dumpPollInterval) clearInterval(dumpPollInterval);
        } catch (e) {
            setStatus('Ошибка: ' + e.message, '#ffecec', '#e74c3c');
        }
    }

    async function pollDumpProgress() {
        try {
            const res = await fetch('/progress');
            if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);

            const data = await res.json();
            const p = Math.max(0, Math.min(100, data.percent || 0));
            setProgress(p);

            if (data.running) {
                setStatus('Обработка... ' + p + '%', '#edf7ff', '#2c3e50');
            } else {
                setProgress(100, true);
                setStatus('Успешно завершено!', '#e7f6ec', '#27ae60');
                if (dumpPollInterval) clearInterval(dumpPollInterval);
            }
        } catch (e) {
            setStatus('Ошибка запроса прогресса: ' + e.message, '#ffecec', '#e74c3c');
            if (dumpPollInterval) clearInterval(dumpPollInterval);
        }
    }

    // Функции для режима мониторинга
    async function startMonitoring() {
        const chats = document.getElementById('monitorChats').value.split('\n')
            .map(s => s.trim())
            .filter(Boolean);
        const keywords = document.getElementById('monitorKeywords').value.split('\n')
            .map(s => s.trim())
            .filter(Boolean);
        const caseSensitive = document.getElementById('caseSensitive').checked;
        const regexMode = document.getElementById('regexMode').checked;
        const interval = parseInt(document.getElementById('checkInterval').value);

        if (chats.length === 0) {
            setMonitorStatus('Ошибка: не указаны чаты для мониторинга', '#ffecec', '#e74c3c');
            return;
        }
        if (keywords.length === 0) {
            setMonitorStatus('Ошибка: не указаны ключевые слова', '#ffecec', '#e74c3c');
            return;
        }

        const config = {
            monitoredChats: chats,
            keywords: keywords,
            caseSensitive: caseSensitive,
            regexMode: regexMode,
            checkIntervalMinutes: interval
        };

        try {
            setMonitorStatus('Запуск мониторинга...', '#fff4e6', '#e67e22');

            const response = await fetch('/api/monitor/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(config)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || 'Ошибка сервера: ' + response.status);
            }

            const result = await response.text();
            setMonitorStatus('Мониторинг запущен: ' + result, '#e7f6ec', '#27ae60');
            document.getElementById('monitorStatusText').textContent = 'Активен';

            // Запускаем опрос статуса мониторинга
            if (monitorPollInterval) clearInterval(monitorPollInterval);
            monitorPollInterval = setInterval(pollMonitorStatus, 2000);

        } catch (error) {
            setMonitorStatus('Ошибка запуска: ' + error.message, '#ffecec', '#e74c3c');
        }
    }

    async function stopMonitoring() {
        try {
            setMonitorStatus('Остановка мониторинга...', '#fff4e6', '#e67e22');

            const response = await fetch('/api/monitor/stop', {method: 'POST'});
            const result = await response.text();

            setMonitorStatus('Мониторинг остановлен: ' + result, '#fff4e6', '#e67e22');
            document.getElementById('monitorStatusText').textContent = 'Не активен';

            if (monitorPollInterval) clearInterval(monitorPollInterval);
        } catch (error) {
            setMonitorStatus('Ошибка остановки: ' + error.message, '#ffecec', '#e74c3c');
        }
    }

    async function pollMonitorStatus() {
        try {
            const response = await fetch('/api/monitor/status');
            if (response.ok) {
                const status = await response.json();
                document.getElementById('monitorStatusText').textContent =
                    status.monitoring ? 'Активен' : 'Не активен';
            }
        } catch (error) {
            console.error('Ошибка опроса статуса мониторинга:', error);
        }
    }

    async function showResults() {
        try {
            const response = await fetch('/api/monitor/results');
            if (!response.ok) throw new Error('Ошибка сервера: ' + response.status);

            const results = await response.json();
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            if (results.length === 0) {
                resultsList.innerHTML = '<p>Совпадений не найдено</p>';
                document.getElementById('monitorResults').style.display = 'block';
                return;
            }

            results.forEach(result => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <strong>${result.chatTitle || 'Неизвестный чат'}</strong> - ${result.keyword}
                    <br><small>${new Date(result.messageDate).toLocaleString('ru-RU')}</small>
                    <p>${result.messageText || 'Нет текста'}</p>
                    <small>Отправитель: ${result.senderName || 'Неизвестен'}</small>
                    <hr>
                `;
                resultsList.appendChild(div);
            });

            document.getElementById('monitorResults').style.display = 'block';
        } catch (error) {
            alert('Ошибка получения результатов: ' + error.message);
        }
    }

    // Вспомогательные функции
    function setStatus(text, bg, color) {
        const el = document.getElementById('status');
        el.textContent = text;
        el.style.background = bg;
        el.style.color = color;
    }

    function setMonitorStatus(text, bg, color) {
        const el = document.getElementById('monitorStatus');
        el.textContent = text;
        el.style.background = bg;
        el.style.color = color;
    }

    function setProgress(val, done) {
        document.getElementById('progress-bar').style.width = val + '%';
        document.getElementById('progress-value').textContent = val + '%';
        if (done) document.getElementById('progress-bar').classList.add('green');
    }

    // Обработчик выбора интервала
    document.querySelectorAll('.interval-option').forEach(option => {
        option.addEventListener('click', function() {
            // Убираем выделение со всех вариантов
            document.querySelectorAll('.interval-option').forEach(opt => {
                opt.classList.remove('selected');
            });

            // Добавляем выделение текущему варианту
            this.classList.add('selected');

            // Сохраняем значение
            const value = this.getAttribute('data-value');
            document.getElementById('checkInterval').value = value;

            saveSettings();
        });
    });

    // Автоматическое сохранение настроек в localStorage
    function saveSettings() {
        const settings = {
            photos: document.getElementById('photos').checked,
            videos: document.getElementById('videos').checked,
            links: document.getElementById('links').checked,
            messages: document.getElementById('messages').checked,
            textDocuments: document.getElementById('textDocuments').checked,
            audio: document.getElementById('audio').checked,
            chats: document.getElementById('chats').value,
            textDocumentExtensions: document.getElementById('textExtensions').value,
            monitorChats: document.getElementById('monitorChats').value,
            monitorKeywords: document.getElementById('monitorKeywords').value,
            caseSensitive: document.getElementById('caseSensitive').checked,
            regexMode: document.getElementById('regexMode').checked,
            checkInterval: document.getElementById('checkInterval').value
        };
        localStorage.setItem('tdlibSettings', JSON.stringify(settings));
    }

    function loadSettings() {
        const saved = localStorage.getItem('tdlibSettings');
        if (saved) {
            const settings = JSON.parse(saved);
            document.getElementById('photos').checked = settings.photos;
            document.getElementById('videos').checked = settings.videos;
            document.getElementById('links').checked = settings.links;
            document.getElementById('messages').checked = settings.messages;
            document.getElementById('textDocuments').checked = settings.textDocuments;
            document.getElementById('audio').checked = settings.audio;
            document.getElementById('chats').value = settings.chats || '';
            document.getElementById('textExtensions').value = settings.textDocumentExtensions || '';
            document.getElementById('monitorChats').value = settings.monitorChats || '';
            document.getElementById('monitorKeywords').value = settings.monitorKeywords || '';
            document.getElementById('caseSensitive').checked = settings.caseSensitive || false;
            document.getElementById('regexMode').checked = settings.regexMode || false;
            document.getElementById('checkInterval').value = settings.checkInterval || '1';

            // Устанавливаем выделение для интервала
            document.querySelectorAll('.interval-option').forEach(option => {
                option.classList.remove('selected');
                if (option.getAttribute('data-value') === settings.checkInterval) {
                    option.classList.add('selected');
                }
            });

            // Показать/скрыть поле расширений
            toggleTextDocumentExtensions();
        }
    }

    // Загрузка настроек при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {
        loadSettings();
        showDumpMode(); // Показываем режим дампа по умолчанию
    });

    // Сохранение настроек при изменении
    const inputsToWatch = [
        'photos', 'videos', 'links', 'messages', 'textDocuments', 'audio',
        'chats', 'textExtensions', 'monitorChats', 'monitorKeywords',
        'caseSensitive', 'regexMode', 'checkInterval'
    ];

    inputsToWatch.forEach(id => {
        const element = document.getElementById(id);
        if (element) {
            if (element.type === 'checkbox' || element.type === 'number') {
                element.addEventListener('change', saveSettings);
            } else {
                element.addEventListener('input', saveSettings);
            }
        }
    });
</script>
</body>
</html>
