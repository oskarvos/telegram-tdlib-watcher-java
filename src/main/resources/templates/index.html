<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDLib Chat Dump</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            padding: 30px;
            margin: 20px 0;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            resize: vertical;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input {
            margin-right: 8px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin: 25px 0;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #startBtn {
            background-color: #3498db;
            color: white;
        }

        #startBtn:hover {
            background-color: #2980b9;
        }

        #stopBtn {
            background-color: #e74c3c;
            color: white;
        }

        #stopBtn:hover {
            background-color: #c0392b;
        }

        .progress-container {
            margin-top: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
            color: #7f8c8d;
        }

        #progress {
            width: 100%;
            height: 20px;
            background-color: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0;
            background-color: #e74c3c;
            transition: width 0.3s, background-color 0.3s;
        }

        #progress-bar.green {
            background-color: #2ecc71;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .instructions {
            margin-top: 30px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .instructions h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .instructions ul {
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>TDLib Chat Dump</h1>

    <div class="form-group">
        <label for="chats">Chat Links or IDs (one per line):</label>
        <textarea id="chats" placeholder="Enter chat links or IDs, one per line"></textarea>
    </div>

    <div class="checkbox-group">
        <div class="checkbox-item">
            <input type="checkbox" id="photos">
            <label for="photos">Photos</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="videos">
            <label for="videos">Videos</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="links">
            <label for="links">Links</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="messages">
            <label for="messages">Messages</label>
        </div>
    </div>

    <div class="buttons">
        <button id="startBtn" onclick="startDump()">Start Dump</button>
        <button id="stopBtn" onclick="stopDump()">Stop</button>
    </div>

    <div class="progress-container">
        <div class="progress-label">
            <span>Progress:</span>
            <span id="progress-value">0%</span>
        </div>
        <div id="progress">
            <div id="progress-bar"></div>
        </div>
        <div class="status" id="status">Ready to start</div>
    </div>

    <div class="instructions">
        <h3>How to use:</h3>
        <ul>
            <li>Enter chat links or IDs (one per line)</li>
            <li>Select what content you want to dump</li>
            <li>Click "Start Dump" to begin the process</li>
            <li>Monitor progress in the progress bar</li>
            <li>Click "Stop" to cancel the operation</li>
        </ul>
    </div>
</div>

<script>
    async function startDump() {
        const chats = document.getElementById('chats').value.split(/\n+/);
        const request = {
            chats: chats,
            photos: document.getElementById('photos').checked,
            videos: document.getElementById('videos').checked,
            links: document.getElementById('links').checked,
            messages: document.getElementById('messages').checked
        };

        document.getElementById('progress-bar').classList.remove('green');
        document.getElementById('status').textContent = 'Starting dump process...';

        try {
            await fetch('/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(request)
            });
            poll();
        } catch (error) {
            document.getElementById('status').textContent = 'Error: ' + error.message;
        }
    }

    async function stopDump() {
        document.getElementById('status').textContent = 'Stopping...';
        try {
            await fetch('/stop', {method: 'POST'});
            document.getElementById('status').textContent = 'Stopped';
        } catch (error) {
            document.getElementById('status').textContent = 'Error: ' + error.message;
        }
    }

    async function poll() {
        try {
            const res = await fetch('/progress');
            const data = await res.json();

            if (data.running) {
                // Update progress bar (simulated since we don't have real progress data)
                const progressValue = Math.min(100, Math.floor(Math.random() * 10) + 1 + parseInt(document.getElementById('progress-value').textContent));
                document.getElementById('progress-bar').style.width = progressValue + '%';
                document.getElementById('progress-value').textContent = progressValue + '%';
                document.getElementById('status').textContent = 'Processing...';

                setTimeout(poll, 1000);
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('progress-value').textContent = '100%';
                document.getElementById('progress-bar').classList.add('green');
                document.getElementById('status').textContent = 'Completed successfully';
            }
        } catch (error) {
            document.getElementById('status').textContent = 'Error: ' + error.message;
        }
    }
</script>
</body>
</html>
