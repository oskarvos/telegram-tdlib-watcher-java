<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDLib Дамп Чатов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
            color: #333;
        }

        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1500px;
            margin-bottom: 20px;
        }

        .container {
            flex: 1;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            padding: 35px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 700;
            font-size: 32px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 700;
            font-size: 24px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
            color: #6a11cb;
            font-size: 48px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            font-size: 15px;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.2);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.2);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: #eef2f7;
            transform: translateY(-2px);
        }

        .checkbox-item input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin: 30px 0;
        }

        button {
            flex: 1;
            padding: 16px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #startBtn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }

        #startBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(106, 17, 203, 0.4);
        }

        #stopBtn {
            background: #ffffff;
            color: #e74c3c;
            border: 2px solid #e74c3c;
        }

        #stopBtn:hover {
            background: #e74c3c;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(231, 76, 60, 0.4);
        }

        #startMonitorBtn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
        }

        #startMonitorBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(46, 204, 113, 0.4);
        }

        #stopMonitorBtn {
            background: #ffffff;
            color: #f39c12;
            border: 2px solid #f39c12;
        }

        #stopMonitorBtn:hover {
            background: #f39c12;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(243, 156, 18, 0.4);
        }

        .progress-container {
            margin-top: 25px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
            color: #2c3e50;
            font-weight: 500;
        }

        #progress {
            width: 100%;
            height: 24px;
            background-color: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            transition: width 0.5s ease;
            border-radius: 12px;
        }

        #progress-bar.green {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }

        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
            color: #2c3e50;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            background: #edf7ff;
        }

        .instructions {
            margin-top: 35px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #eef2f7 100%);
            border-radius: 12px;
            font-size: 15px;
            color: #2c3e50;
            border-left: 5px solid #6a11cb;
        }

        .instructions h3 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instructions ul {
            padding-left: 25px;
        }

        .instructions li {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: white;
            font-size: 14px;
            opacity: 0.8;
        }

        .text-document-extensions {
            display: none;
            margin-top: 15px;
        }

        .text-document-extensions input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 14px;
        }

        .monitor-status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }

        .monitor-status.success {
            background-color: #e7f6ec;
            color: #27ae60;
        }

        .monitor-status.error {
            background-color: #ffecec;
            color: #e74c3c;
        }

        .monitor-status.stopped {
            background-color: #fff4e6;
            color: #f39c12;
        }

        @media (max-width: 1200px) {
            .main-container {
                flex-direction: column;
            }
        }

        @media (max-width: 768px) {
            .checkbox-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="container">
        <div class="logo">
            <i class="fab fa-telegram"></i>
        </div>
        <h1>TDLib Дамп Чатов</h1>

        <div class="form-group">
            <label for="chats">Ссылки или ID чатов (по одному на строку):</label>
            <textarea id="chats" placeholder="Введите ссылки или ID чатов, по одному на строку"></textarea>
        </div>

        <div class="checkbox-group">
            <div class="checkbox-item">
                <input type="checkbox" id="photos" checked>
                <label for="photos">Фотографии</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="videos" checked>
                <label for="videos">Видео</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="links" checked>
                <label for="links">Ссылки</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="messages" checked>
                <label for="messages">Сообщения</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="textDocuments" onclick="toggleTextDocumentExtensions()">
                <label for="textDocuments">Текстовые документы</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="audio" checked>
                <label for="audio">Аудио файлы</label>
            </div>
        </div>

        <div class="text-document-extensions">
            <label for="textExtensions">Введите расширения текстовых документов (через запятую):</label>
            <input type="text" id="textExtensions" placeholder="txt, pdf, docx, java, html" />
        </div>

        <div class="buttons">
            <button id="startBtn" onclick="startDump()">
                <i class="fas fa-play-circle"></i> Начать дамп
            </button>
            <button id="stopBtn" onclick="stopDump()">
                <i class="fas fa-stop-circle"></i> Остановить
            </button>
        </div>

        <div class="progress-container">
            <div class="progress-label">
                <span>Прогресс:</span>
                <span id="progress-value">0%</span>
            </div>
            <div id="progress">
                <div id="progress-bar"></div>
            </div>
            <div class="status" id="status">Готово к началу</div>
        </div>
    </div>

    <div class="container">
        <h2><i class="fas fa-search"></i> Мониторинг чатов</h2>

        <div class="form-group">
            <label for="monitorChats">Чаты для мониторинга (по одному на строку):</label>
            <textarea id="monitorChats" placeholder="Введите ссылки или ID чатов для мониторинга"></textarea>
        </div>

        <div class="form-group">
            <label for="searchTerm">Слово или фраза для поиска:</label>
            <input type="text" id="searchTerm" placeholder="Введите текст для поиска">
        </div>

        <div class="checkbox-item">
            <input type="checkbox" id="caseSensitive">
            <label for="caseSensitive">Учитывать регистр</label>
        </div>

        <div class="buttons">
            <button id="startMonitorBtn" onclick="startMonitoring()">
                <i class="fas fa-play-circle"></i> Начать мониторинг
            </button>
            <button id="stopMonitorBtn" onclick="stopMonitoring()">
                <i class="fas fa-stop-circle"></i> Остановить мониторинг
            </button>
        </div>

        <div class="progress-container">
            <div class="progress-label">
                <span>Статус мониторинга:</span>
                <span id="monitor-status">Не активен</span>
            </div>
            <div class="progress-label">
                <span>Отслеживаемых чатов:</span>
                <span id="monitored-chats">0</span>
            </div>
            <div class="progress-label">
                <span>Найдено совпадений:</span>
                <span id="matches-found">0</span>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    <p>TDLib Chat Dump &copy; 2025</p>
</div>

<script>
    function toggleTextDocumentExtensions() {
        const textDocs = document.getElementById('textDocuments');
        const extensionsField = document.querySelector('.text-document-extensions');
        extensionsField.style.display = textDocs.checked ? 'block' : 'none';
    }

    async function startDump() {
        const chats = document.getElementById('chats').value
            .split(/\n+/)
            .map(s => s.trim())
            .filter(Boolean);

        const request = {
            chats: chats,
            photos: document.getElementById('photos').checked,
            videos: document.getElementById('videos').checked,
            links: document.getElementById('links').checked,
            messages: document.getElementById('messages').checked,
            textDocuments: document.getElementById('textDocuments').checked,
            audio: document.getElementById('audio').checked,
            textDocumentExtensions: document.getElementById('textExtensions').value.trim()
        };

        if (request.chats.length === 0) {
            setStatus('Ошибка: не указаны чаты для обработки', '#ffecec', '#e74c3c');
            return;
        }
        if (!request.photos && !request.videos && !request.links &&
            !request.messages && !request.textDocuments && !request.audio) {
            setStatus('Ошибка: не выбран ни один тип контента', '#ffecec', '#e74c3c');
            return;
        }

        document.getElementById('progress-bar').classList.remove('green');
        setStatus('Начинаем процесс дампа...', '#edf7ff', '#2c3e50');
        setProgress(0);

        try {
            const res = await fetch('/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(request)
            });
            if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);

            setStatus('Обработка...', '#edf7ff', '#2c3e50');
            poll();
        } catch (e) {
            setStatus('Ошибка запуска: ' + e.message, '#ffecec', '#e74c3c');
        }
    }

    async function stopDump() {
        setStatus('Останавливаем...', '#fff4e6', '#e67e22');
        try {
            const res = await fetch('/stop', {method: 'POST'});
            if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);
            setStatus('Остановлено', '#ffecec', '#e74c3c');
        } catch (e) {
            setStatus('Ошибка: ' + e.message, '#ffecec', '#e74c3c');
        }
    }

    async function poll() {
        try {
            const res = await fetch('/progress');
            if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);
            const data = await res.json();

            const p = Math.max(0, Math.min(100, data.percent || 0));
            setProgress(p);

            if (data.running) {
                setStatus('Обработка... ' + p + '%', '#edf7ff', '#2c3e50');
                setTimeout(poll, 1000);
            } else {
                setProgress(100, true);
                setStatus('Успешно завершено!', '#e7f6ec', '#27ae60');
            }
        } catch (e) {
            setStatus('Ошибка запроса прогресса: ' + e.message, '#ffecec', '#e74c3c');
        }
    }

    async function startMonitoring() {
        const chats = document.getElementById('monitorChats').value
            .split(/\n+/)
            .map(s => s.trim())
            .filter(Boolean);

        const searchTerm = document.getElementById('searchTerm').value.trim();
        const caseSensitive = document.getElementById('caseSensitive').checked;

        if (chats.length === 0) {
            setMonitorStatus('Ошибка: не указаны чаты для мониторинга', 'error');
            return;
        }

        if (!searchTerm) {
            setMonitorStatus('Ошибка: не указан текст для поиска', 'error');
            return;
        }

        const request = {
            chats: chats,
            searchTerm: searchTerm,
            caseSensitive: caseSensitive
        };

        try {
            const res = await fetch('/monitor/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(request)
            });

            if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);

            setMonitorStatus('Мониторинг запущен', 'success');
            pollMonitorStatus();

        } catch (e) {
            setMonitorStatus('Ошибка запуска: ' + e.message, 'error');
        }
    }

    async function stopMonitoring() {
        try {
            const res = await fetch('/monitor/stop', {method: 'POST'});
            if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);

            setMonitorStatus('Мониторинг остановлен', 'stopped');

        } catch (e) {
            setMonitorStatus('Ошибка остановки: ' + e.message, 'error');
        }
    }

    async function pollMonitorStatus() {
        try {
            const res = await fetch('/monitor/status');
            if (!res.ok) throw new Error('Сервер вернул ошибку ' + res.status);

            const data = await res.json();

            document.getElementById('monitored-chats').textContent = data.monitoredChats;
            document.getElementById('matches-found').textContent = data.matchesFound;

            if (data.monitoring) {
                setMonitorStatus('Активен', 'success');
                setTimeout(pollMonitorStatus, 2000);
            }

        } catch (e) {
            console.error('Ошибка запроса статуса мониторинга:', e);
        }
    }

    function setMonitorStatus(text, type) {
        const el = document.getElementById('monitor-status');
        el.textContent = text;

        const colors = {
            success: '#27ae60',
            error: '#e74c3c',
            stopped: '#f39c12'
        };

        el.style.color = colors[type] || '#2c3e50';
    }

    function setStatus(text, bg, color) {
        const el = document.getElementById('status');
        el.textContent = text;
        el.style.background = bg;
        el.style.color = color;
    }

    function setProgress(val, done) {
        document.getElementById('progress-bar').style.width = val + '%';
        document.getElementById('progress-value').textContent = val + '%';
        if (done) document.getElementById('progress-bar').classList.add('green');
    }

    // Автоматическое сохранение настроек в localStorage
    function saveSettings() {
        const settings = {
            photos: document.getElementById('photos').checked,
            videos: document.getElementById('videos').checked,
            links: document.getElementById('links').checked,
            messages: document.getElementById('messages').checked,
            textDocuments: document.getElementById('textDocuments').checked,
            audio: document.getElementById('audio').checked,
            chats: document.getElementById('chats').value,
            textDocumentExtensions: document.getElementById('textExtensions').value,
            monitorChats: document.getElementById('monitorChats').value,
            searchTerm: document.getElementById('searchTerm').value,
            caseSensitive: document.getElementById('caseSensitive').checked
        };
        localStorage.setItem('tdlibDumpSettings', JSON.stringify(settings));
    }

    function loadSettings() {
        const saved = localStorage.getItem('tdlibDumpSettings');
        if (saved) {
            const settings = JSON.parse(saved);
            document.getElementById('photos').checked = settings.photos;
            document.getElementById('videos').checked = settings.videos;
            document.getElementById('links').checked = settings.links;
            document.getElementById('messages').checked = settings.messages;
            document.getElementById('textDocuments').checked = settings.textDocuments;
            document.getElementById('audio').checked = settings.audio;
            document.getElementById('chats').value = settings.chats || '';
            document.getElementById('textExtensions').value = settings.textDocumentExtensions || '';
            document.getElementById('monitorChats').value = settings.monitorChats || '';
            document.getElementById('searchTerm').value = settings.searchTerm || '';
            document.getElementById('caseSensitive').checked = settings.caseSensitive || false;

            // Показать поле расширений, если нужно
            if (settings.textDocuments) {
                document.querySelector('.text-document-extensions').style.display = 'block';
            }
        }
    }

    // Загрузка настроек при загрузке страницы
    document.addEventListener('DOMContentLoaded', loadSettings);

    // Сохранение настроек при изменении
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('change', saveSettings);
    });

    document.getElementById('chats').addEventListener('input', saveSettings);
    document.getElementById('monitorChats').addEventListener('input', saveSettings);
    document.getElementById('searchTerm').addEventListener('input', saveSettings);
</script>
</body>
</html>
