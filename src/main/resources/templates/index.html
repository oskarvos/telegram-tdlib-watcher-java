<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDLib Дамп и Поиск Чатов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Стили остаются без изменений, как в предоставленном примере */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            padding: 35px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 700;
            font-size: 32px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
            color: #6a11cb;
            font-size: 48px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            font-size: 15px;
            transition: all 0.3s;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.2);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: #eef2f7;
            transform: translateY(-2px);
        }

        .checkbox-item input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin: 30px 0;
        }

        button {
            flex: 1;
            padding: 16px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #startBtn, #startSearchBtn {
            background: #6a11cb;
            color: white;
        }

        #startBtn:hover, #startSearchBtn:hover {
            background: #5a0fb8;
        }

        #stopBtn, #stopSearchBtn {
            background: #e74c3c;
            color: white;
        }

        #stopBtn:hover, #stopSearchBtn:hover {
            background: #d62c1a;
        }

        #showSearchResultsBtn, #deleteSearchDbBtn {
            background: #27ae60;
            color: white;
        }

        #showSearchResultsBtn:hover, #deleteSearchDbBtn:hover {
            background: #219a52;
        }

        .text-document-extensions {
            display: none;
            margin-top: 15px;
        }

        .progress-container {
            margin-top: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }

        #progress, #searchProgress {
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-bar, #searchProgress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            transition: width 0.3s;
        }

        #progress-bar.green, #searchProgress-bar.green {
            background: #27ae60;
        }

        #status, #searchStatus {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            background: #edf7ff;
            color: #2c3e50;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: white;
            font-size: 14px;
            opacity: 0.8;
        }

        .mode-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-switcher button {
            padding: 12px 20px;
            background: #34495e;
            color: white;
        }

        .mode-switcher button:hover {
            background: #2c3e50;
        }

        .mode-switcher button.active {
            background: #6a11cb;
        }

        .results-container {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-item {
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #6a11cb;
        }

        @media (max-width: 768px) {
            .checkbox-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
<!-- Разметка остается без изменений -->
<div class="mode-switcher">
    <button id="dumpModeBtn" class="active" onclick="app.showDumpMode()">Режим выгрузки</button>
    <button id="searchModeBtn" onclick="app.showSearchMode()">Режим поиска</button>
</div>

<div class="container" id="dumpContainer">
    <div class="logo">
        <i class="fab fa-telegram"></i>
    </div>
    <h1>TDLib Дамп Чатов</h1>

    <div class="form-group">
        <label for="chats">Ссылки или ID чатов (по одному на строку):</label>
        <textarea id="chats" placeholder="Введите ссылки или ID чатов, по одному на строку"></textarea>
    </div>

    <div class="checkbox-group">
        <div class="checkbox-item">
            <input type="checkbox" id="photos" checked>
            <label for="photos">Фотографии</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="videos" checked>
            <label for="videos">Видео</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="links" checked>
            <label for="links">Ссылки</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="messages" checked>
            <label for="messages">Сообщения</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="textDocuments" onclick="dumpMode.toggleTextDocumentExtensions()">
            <label for="textDocuments">Текстовые документы</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="audio" checked>
            <label for="audio">Аудио файлы</label>
        </div>
    </div>

    <div class="text-document-extensions">
        <label for="textExtensions">Введите расширения текстовых документов (через запятую):</label>
        <input type="text" id="textExtensions" placeholder="txt, pdf, docx, java, html"/>
    </div>

    <div class="buttons">
        <button id="startBtn" onclick="dumpMode.startDump()">
            <i class="fas fa-play-circle"></i> Начать дамп
        </button>
        <button id="stopBtn" onclick="dumpMode.stopDump()">
            <i class="fas fa-stop-circle"></i> Остановить
        </button>
    </div>

    <div class="progress-container">
        <div class="progress-label">
            <span>Прогресс:</span>
            <span id="progress-value">0%</span>
        </div>
        <div id="progress">
            <div id="progress-bar"></div>
        </div>
        <div class="status" id="status">Готово к началу</div>
    </div>
</div>

<div class="container" id="searchContainer" style="display: none;">
    <div class="logo">
        <i class="fas fa-search"></i>
    </div>
    <h1>Поиск в чатах</h1>

    <div class="form-group">
        <label for="searchChats">Чаты для поиска (по одному на строку):</label>
        <textarea id="searchChats" placeholder="Введите ссылки или ID чатов для поиска"></textarea>
    </div>

    <div class="form-group">
        <label for="searchKeyword">Ключевое слово для поиска:</label>
        <input type="text" id="searchKeyword" placeholder="Введите ключевое слово">
    </div>

    <div class="checkbox-group">
        <div class="checkbox-item">
            <input type="checkbox" id="caseSensitive">
            <label for="caseSensitive">Чувствительность к регистру</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="regexMode">
            <label for="regexMode">Регулярные выражения</label>
        </div>
    </div>

    <div class="buttons">
        <button id="startSearchBtn" onclick="searchMode.startSearch()">
            <i class="fas fa-play"></i> Начать поиск
        </button>
        <button id="stopSearchBtn" onclick="searchMode.stopSearch()">
            <i class="fas fa-stop"></i> Остановить
        </button>
        <button id="deleteSearchDbBtn" onclick="searchMode.deleteSearchDatabase()">
            <i class="fas fa-trash"></i> Удалить БД поиска
        </button>
        <button id="showSearchResultsBtn" onclick="searchMode.showSearchResults()">
            <i class="fas fa-list"></i> Показать результаты
        </button>
    </div>

    <div class="progress-container">
        <div class="progress-label">
            <span>Обработано сообщений:</span>
            <span id="searchProgressValue">0</span>
        </div>
        <div id="searchProgress">
            <div id="searchProgress-bar"></div>
        </div>
        <div class="status" id="searchStatus">Поиск не запущен</div>
    </div>

    <div id="searchResults" class="results-container" style="display: none;">
        <h3>Результаты поиска</h3>
        <div id="searchResultsList"></div>
    </div>
</div>

<div class="footer">
    <p>TDLib Chat Dump & Search &copy; 2025</p>
</div>

<script>
    // Главный класс приложения
    class App {
        constructor() {
            this.currentMode = 'dump';
            this.init();
        }

        init() {
            // Инициализация режимов
            this.dumpMode = new DumpMode();
            this.searchMode = new SearchMode();

            // Показываем начальный режим
            this.showDumpMode();
        }

        showDumpMode() {
            document.getElementById('dumpContainer').style.display = 'block';
            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('dumpModeBtn').classList.add('active');
            document.getElementById('searchModeBtn').classList.remove('active');
            this.currentMode = 'dump';
        }

        showSearchMode() {
            document.getElementById('dumpContainer').style.display = 'none';
            document.getElementById('searchContainer').style.display = 'block';
            document.getElementById('dumpModeBtn').classList.remove('active');
            document.getElementById('searchModeBtn').classList.add('active');
            this.currentMode = 'search';
        }
    }

    // Базовый класс для работы с API
    class ApiClient {
        constructor() {
            this.baseUrl = '';
        }

        async request(endpoint, options = {}) {
            try {
                const response = await fetch(`${this.baseUrl}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || `Сервер вернул ошибку ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                console.error(`Ошибка запроса к ${endpoint}:`, error);
                throw error;
            }
        }

        async post(endpoint, data) {
            return this.request(endpoint, {
                method: 'POST',
                body: JSON.stringify(data)
            });
        }

        async get(endpoint) {
            return this.request(endpoint, {
                method: 'GET'
            });
        }
    }

    // Класс для режима дампа
    class DumpMode extends ApiClient {
        constructor() {
            super();
            this.pollInterval = null;
        }

        toggleTextDocumentExtensions() {
            const textDocs = document.getElementById('textDocuments');
            const extensionsField = document.querySelector('.text-document-extensions');
            extensionsField.style.display = textDocs.checked ? 'block' : 'none';
        }

        async startDump() {
            const chats = document.getElementById('chats').value
                .split(/\n+/)
                .map(s => s.trim())
                .filter(Boolean);

            const request = {
                chats: chats,
                photos: document.getElementById('photos').checked,
                videos: document.getElementById('videos').checked,
                links: document.getElementById('links').checked,
                messages: document.getElementById('messages').checked,
                textDocuments: document.getElementById('textDocuments').checked,
                audio: document.getElementById('audio').checked,
                textDocumentExtensions: document.getElementById('textExtensions').value.trim()
            };

            if (request.chats.length === 0) {
                this.setStatus('Ошибка: не указаны чаты для обработки', '#ffecec', '#e74c3c');
                return;
            }
            if (!request.photos && !request.videos && !request.links &&
                !request.messages && !request.textDocuments && !request.audio) {
                this.setStatus('Ошибка: не выбран ни один тип контента', '#ffecec', '#e74c3c');
                return;
            }

            document.getElementById('progress-bar').classList.remove('green');
            this.setStatus('Начинаем процесс дампа...', '#edf7ff', '#2c3e50');
            this.setProgress(0);

            try {
                await this.post('/start', request);
                this.setStatus('Обработка...', '#edf7ff', '#2c3e50');

                // Останавливаем предыдущий интервал, если он был
                if (this.pollInterval) clearInterval(this.pollInterval);
                this.pollInterval = setInterval(() => this.pollDumpProgress(), 1000);
            } catch (error) {
                this.setStatus('Ошибка запуска: ' + error.message, '#ffecec', '#e74c3c');
            }
        }

        async stopDump() {
            this.setStatus('Останавливаем...', '#fff4e6', '#e67e22');
            try {
                await this.post('/stop', {});
                this.setStatus('Остановлено', '#ffecec', '#e74c3c');
                if (this.pollInterval) clearInterval(this.pollInterval);
            } catch (error) {
                this.setStatus('Ошибка: ' + error.message, '#ffecec', '#e74c3c');
            }
        }

        async pollDumpProgress() {
            try {
                const data = await this.get('/progress');
                const p = Math.max(0, Math.min(100, data.percent || 0));
                this.setProgress(p);

                if (data.running) {
                    this.setStatus('Обработка... ' + p + '%', '#edf7ff', '#2c3e50');
                } else {
                    this.setProgress(100, true);
                    this.setStatus('Успешно завершено!', '#e7f6ec', '#27ae60');
                    if (this.pollInterval) clearInterval(this.pollInterval);
                }
            } catch (error) {
                this.setStatus('Ошибка запроса прогресса: ' + error.message, '#ffecec', '#e74c3c');
                if (this.pollInterval) clearInterval(this.pollInterval);
            }
        }

        setProgress(percent, isComplete = false) {
            const progressBar = document.getElementById('progress-bar');
            const progressValue = document.getElementById('progress-value');

            progressBar.style.width = percent + '%';
            progressValue.textContent = percent + '%';

            if (isComplete) {
                progressBar.classList.add('green');
            } else {
                progressBar.classList.remove('green');
            }
        }

        setStatus(message, backgroundColor, color) {
            const statusElement = document.getElementById('status');
            statusElement.textContent = message;
            statusElement.style.backgroundColor = backgroundColor;
            statusElement.style.color = color;
        }
    }

    // Класс для режима поиска
    class SearchMode extends ApiClient {
        constructor() {
            super();
            this.pollInterval = null;
        }

        async startSearch() {
            const chats = document.getElementById('searchChats').value
                .split(/\n+/)
                .map(s => s.trim())
                .filter(Boolean);

            const keyword = document.getElementById('searchKeyword').value.trim();

            if (chats.length === 0) {
                this.setStatus('Ошибка: не указаны чаты для поиска', '#ffecec', '#e74c3c');
                return;
            }

            if (!keyword) {
                this.setStatus('Ошибка: не указано ключевое слово', '#ffecec', '#e74c3c');
                return;
            }

            const request = {
                chats: chats,
                keyword: keyword,
                caseSensitive: document.getElementById('caseSensitive').checked,
                useRegex: document.getElementById('regexMode').checked
            };

            document.getElementById('searchProgress-bar').classList.remove('green');
            this.setStatus('Начинаем поиск...', '#edf7ff', '#2c3e50');
            this.setProgress(0);

            try {
                await this.post('/api/search/start', request);
                this.setStatus('Поиск выполняется...', '#edf7ff', '#2c3e50');

                // Останавливаем предыдущий интервал, если он был
                if (this.pollInterval) clearInterval(this.pollInterval);
                this.pollInterval = setInterval(() => this.pollSearchProgress(), 1000);
            } catch (error) {
                this.setStatus('Ошибка запуска: ' + error.message, '#ffecec', '#e74c3c');
            }
        }

        async stopSearch() {
            this.setStatus('Останавливаем поиск...', '#fff4e6', '#e67e22');
            try {
                await this.post('/api/search/stop', {});
                this.setStatus('Поиск остановлен', '#ffecec', '#e74c3c');
                if (this.pollInterval) clearInterval(this.pollInterval);
            } catch (error) {
                this.setStatus('Ошибка: ' + error.message, '#ffecec', '#e74c3c');
            }
        }

        async pollSearchProgress() {
            try {
                const data = await this.get('/api/search/progress');
                this.setProgress(data.processedMessages || 0);

                if (data.running) {
                    this.setStatus(`Поиск выполняется... Обработано сообщений: ${data.processedMessages}`, '#edf7ff', '#2c3e50');
                } else {
                    this.setProgress(data.processedMessages, true);
                    this.setStatus('Поиск завершен!', '#e7f6ec', '#27ae60');
                    if (this.pollInterval) clearInterval(this.pollInterval);
                }
            } catch (error) {
                this.setStatus('Ошибка запроса прогресса: ' + error.message, '#ffecec', '#e74c3c');
                if (this.pollInterval) clearInterval(this.pollInterval);
            }
        }

        async deleteSearchDatabase() {
            try {
                await this.request('/api/search/database', { method: 'DELETE' });
                this.setStatus('База данных поиска удалена', '#e7f6ec', '#27ae60');
            } catch (error) {
                this.setStatus('Ошибка удаления БД: ' + error.message, '#ffecec', '#e74c3c');
            }
        }

        async showSearchResults() {
            try {
                const results = await this.get('/api/search/results');
                this.displayResults(results);
            } catch (error) {
                this.setStatus('Ошибка получения результатов: ' + error.message, '#ffecec', '#e74c3c');
            }
        }

        displayResults(results) {
            const resultsContainer = document.getElementById('searchResults');
            const resultsList = document.getElementById('searchResultsList');

            resultsList.innerHTML = '';

            if (results.length === 0) {
                resultsList.innerHTML = '<p>Результаты не найдены</p>';
            } else {
                results.forEach(result => {
                    const resultElement = document.createElement('div');
                    resultElement.className = 'result-item';
                    resultElement.innerHTML = `
                            <strong>Чат:</strong> ${result.chatTitle}<br>
                            <strong>Дата сообщения:</strong> ${new Date(result.messageDate).toLocaleString()}<br>
                            <strong>Отправитель:</strong> ${result.senderName || result.senderId}<br>
                            <strong>Сообщение:</strong> ${result.messageText}<br>
                            <strong>Найдено:</strong> ${new Date(result.foundDate).toLocaleString()}
                        `;
                    resultsList.appendChild(resultElement);
                });
            }

            resultsContainer.style.display = 'block';
        }

        setProgress(processedMessages, isComplete = false) {
            const progressBar = document.getElementById('searchProgress-bar');
            const progressValue = document.getElementById('searchProgressValue');

            // Для поиска мы просто показываем количество обработанных сообщений
            progressValue.textContent = processedMessages;

            // Можно добавить логику для отображения прогресса в процентах, если будет известен общий объем
            if (isComplete) {
                progressBar.classList.add('green');
            } else {
                progressBar.classList.remove('green');
            }
        }

        setStatus(message, backgroundColor, color) {
            const statusElement = document.getElementById('searchStatus');
            statusElement.textContent = message;
            statusElement.style.backgroundColor = backgroundColor;
            statusElement.style.color = color;
        }
    }

    // Инициализация приложения после загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
        window.app = new App();
        window.dumpMode = app.dumpMode;
        window.searchMode = app.searchMode;
    });
</script>
</body>
</html>
