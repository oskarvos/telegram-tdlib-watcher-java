<!-- index.html -->
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>TDLib Tools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="page-tools">
<div class="container">
    <h1>TDLib Tools</h1>

    <div class="mode-switcher" role="tablist" aria-label="Режимы">
        <button type="button" id="dumpModeBtn" class="active" role="tab" aria-selected="true">Дамп</button>
        <button type="button" id="searchModeBtn" role="tab" aria-selected="false">Поиск</button>
        <button type="button" id="monitorModeBtn" role="tab" aria-selected="false">Мониторинг</button>
    </div>

    <!-- ===== ДАМП ===== -->
    <section id="dumpContainer" aria-label="Дамп">
        <div class="form-group">
            <label>Чаты (по одному в строке, @username, t.me/*, id, first:name)</label>
            <textarea id="chats" rows="4" placeholder="@somechannel
t.me/c/12345/6
id: 123456789"></textarea>
        </div>

        <div class="checkbox-group">
            <div class="checkbox-item"><input id="photos" type="checkbox"><label for="photos">Фото</label></div>
            <div class="checkbox-item"><input id="videos" type="checkbox"><label for="videos">Видео</label></div>
            <div class="checkbox-item"><input id="links" type="checkbox"><label for="links">Ссылки</label></div>
            <div class="checkbox-item"><input id="messages" type="checkbox" checked><label for="messages">Сообщения</label></div>
            <div class="checkbox-item"><input id="textDocuments" type="checkbox"><label for="textDocuments">Документы</label></div>
            <div class="checkbox-item"><input id="audio" type="checkbox"><label for="audio">Аудио</label></div>
        </div>

        <div class="text-document-extensions hidden">
            <label>Расширения текстовых файлов (через запятую, без точки)</label>
            <input id="textExtensions" type="text" placeholder="txt,pdf,doc,docx,rtf,md,csv,json,xml,py,java,js,html,css"/>
            <div style="margin-top:6px;color:#555;font-size:13px;">Если оставить пустым — будут использованы дефолтные расширения сервиса.</div>
        </div>

        <div class="buttons">
            <button class="btn-primary" id="startBtn">Начать дамп</button>
            <button class="btn-danger" id="stopBtn">Остановить</button>
            <button class="btn-danger" id="deleteDumpDbBtn">Удалить все DUMP-БД и все файлы из папки files</button>
        </div>

        <div class="progress-container">
            <div class="progress-label"><span>Прогресс дампа</span><span id="progress-value">0%</span></div>
            <div id="progress"><div id="progress-bar"></div></div>
            <div id="status">Ожидание…</div>
        </div>
    </section>

    <!-- ===== ПОИСК ===== -->
    <section id="searchContainer" class="hidden" aria-label="Поиск">
        <div class="form-group">
            <label>Введите чат (@username, t.me/*, id, first:name)</label>
            <input id="searchChats" type="text" placeholder="@somechannel или https://t.me/somechannel или id: 123456789"/>
        </div>

        <div class="form-group">
            <label>Ключевое слово / Regex <small id="kwLenHint" style="color:#666;font-weight:400;margin-left:6px;">0/50</small></label>
            <input id="searchKeyword" type="text" maxlength="50" placeholder="0–50 символов, можно пусто (тогда — все сообщения)"/>
        </div>

        <div class="search-controls">
            <div class="row">
                <div class="left">
                    <div class="cb checkbox-item"><input id="caseSensitive" type="checkbox"><label for="caseSensitive">Регистр</label></div>
                    <div class="cb checkbox-item"><input id="wholeWord" type="checkbox"><label for="wholeWord" title="Совпадение ровно со словом (Иван ≠ Иванов)">Целое слово</label></div>
                    <div class="cb checkbox-item"><input id="regexMode" type="checkbox"><label for="regexMode">Regex</label></div>
                </div>
                <div class="preset-bar">
                    <button type="button" class="pill" data-preset-regex="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}">Email</button>
                    <button type="button" class="pill" data-preset-regex="https?://[^\s]+">URL</button>
                    <button type="button" class="pill" data-preset-regex="(?&lt;!\d)\d+(?!\d)">Целое число</button>
                    <button type="button" class="pill" data-preset-regex="(?&lt;!\d)\d+(?:[.,]\d{2})?\s?(?:₽|руб\.?)">Сумма ₽</button>
                    <button type="button" class="pill" data-preset-regex="\+7\s?\d{3}\s?\d{3}\s?\d{2}\s?\d{2}">Телефон +7</button>
                    <button type="button" class="pill" data-preset-regex="\b\d{2}\.\d{2}\.\d{4}\b">Дата дд.мм.гггг</button>
                </div>
            </div>

            <div class="row row-length">
                <div class="left">
                    <div class="cb checkbox-item"><input id="lengthMode" type="checkbox"><label for="lengthMode">Искать по длине</label></div>
                </div>
                <div class="length-box">
                    <label for="lengthValue" style="margin:0;">Длина</label>
                    <input id="lengthValue" type="number" min="1" max="30" value="17" style="width:90px;" disabled>
                    <span style="color:#666;">символов</span>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-primary" id="startSearchBtn">Начать поиск</button>
            <button class="btn-danger" id="stopSearchBtn">Остановить</button>
        </div>

        <div class="progress-container">
            <div class="progress-label">
                <span>Статистика</span>
                <span><span id="searchProcessedValue">0</span> / найдено: <span id="searchFoundValue">0</span><span style="margin-left:6px;">, новых: <span class="num-new">0</span></span></span>
            </div>
            <div id="searchProgress"><div id="searchProgress-bar"></div></div>
            <div id="searchStatus" class="statusbar">Ожидание…</div>
        </div>

        <div class="form-group" style="margin-top:16px;">
            <label>Показать результаты для чата</label>
            <input id="searchResultsChat" type="text" placeholder="@channel_or_id"/>
            <div class="buttons" style="margin-top:10px;">
                <button class="btn-success" id="loadSearchResultsBtn">Обновить результаты</button>
                <button class="btn-danger" id="deleteSearchDbBtn">Очистить SEARCH-БД</button>
            </div>
        </div>
        <div class="results-container" id="searchResults"></div>
    </section>

    <!-- ===== МОНИТОРИНГ ===== -->
    <section id="monitorContainer" class="hidden" aria-label="Мониторинг">
        <div class="form-group">
            <label>Чаты (по одному в строке, @username, t.me/*, id, first:name)</label>
            <textarea id="monitorChats" rows="3" placeholder="@somechannel
t.me/c/12345/6
id: 123456789"></textarea>
        </div>

        <div class="form-group">
            <label>Ключевое слово / Regex</label>
            <input id="monitorKeyword" type="text" maxlength="50" placeholder="например, оплата|счёт"/>
        </div>

        <div class="monitor-controls">
            <div class="interval">
                <label for="monitorInterval">Интервал</label>
                <select id="monitorInterval">
                    <option value="1s">1 сек</option>
                    <option value="15s">15 сек</option>
                    <option value="30s">30 сек</option>
                    <option value="1m" selected>1 мин</option>
                    <option value="5m">5 мин</option>
                    <option value="30m">30 мин</option>
                    <option value="1h">1 час</option>
                    <option value="1d">1 день</option>
                </select>
            </div>

            <div class="cb"><input id="monitorCaseSensitive" type="checkbox"><label for="monitorCaseSensitive">Регистр</label></div>
            <div class="cb"><input id="monitorRegexMode" type="checkbox"><label for="monitorRegexMode">Regex</label></div>

            <div class="preset-bar">
                <button type="button" class="pill" data-preset-regex="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}">Email</button>
                <button type="button" class="pill" data-preset-regex="https?://[^\s]+">URL</button>
                <button type="button" class="pill" data-preset-regex="(?&lt;!\d)\d+(?!\d)">Целое число</button>
                <button type="button" class="pill" data-preset-regex="(?&lt;!\d)\d+(?:[.,]\d{2})?\s?(?:₽|руб\.?)">Сумма ₽</button>
                <button type="button" class="pill" data-preset-regex="\b\d{2}\.\d{2}\.\d{4}\b">Дата дд.мм.гггг</button>
            </div>
        </div>

        <div class="buttons" style="margin-top:12px;">
            <button class="btn-primary" id="startMonitorBtn">Старт мониторинга</button>
            <button class="btn-danger" id="stopMonitorBtn">Стоп</button>
        </div>

        <div class="progress-container">
            <div class="progress-label">
                <span>Сообщений обработано</span>
                <span><span id="monitorProcessedValue">0</span> (совпадений: <span id="monitorFoundValue">0</span>)</span>
            </div>
            <div id="monitorProgress"><div id="monitorProgress-bar"></div></div>
            <div id="monitorStatus" style="margin-top:10px;">Ожидание…</div>
        </div>

        <div class="form-group" style="margin-top:16px;">
            <label>Показать срабатывания для чата</label>
            <input id="monitorResultsChat" type="text" placeholder="@channel_or_id"/>
            <div class="buttons" style="margin-top:10px;">
                <button class="btn-success" id="loadMonitorResultsBtn">Обновить результаты</button>
                <button class="btn-danger" id="deleteMonitorDbBtn">Очистить MONITOR-БД + сброс чекпоинтов</button>
            </div>
        </div>
        <div class="results-container" id="monitorResults"></div>
    </section>
</div>

<div id="toasts" class="toasts"></div>
<div class="footer">TDLib Web • Дамп / Поиск / Мониторинг
    2025</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
