<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>TDLib Auth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="page-auth">
<div class="container">
    <h1>Авторизация TDLib</h1>

    <!-- Шаг 1 -->
    <section id="step1" aria-label="Ввод параметров">
        <div class="form-group">
            <label for="apiId">API ID</label>
            <input id="apiId" type="number" placeholder="например, 123456"/>
        </div>
        <div class="form-group">
            <label for="apiHash">API Hash</label>
            <input id="apiHash" type="text" placeholder="например, abcd1234..."/>
        </div>
        <div class="form-group">
            <label for="phone">Телефон</label>
            <input id="phone" type="tel" placeholder="+79991234567"/>
        </div>

        <div class="checkbox-group" style="margin-top:10px;">
            <div class="checkbox-item">
                <input id="useTestDc" type="checkbox">
                <label for="useTestDc">Test DC</label>
            </div>
            <div class="checkbox-item">
                <input id="rememberCreds" type="checkbox">
                <label for="rememberCreds">Запомнить</label>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-primary" id="btnSendCode">Отправить код</button>
            <button class="btn-danger" id="btnClearDb">Очистить БД TDLib</button>
        </div>

        <div class="statusbar" id="s1status" data-state="info">Ожидание…</div>
    </section>

    <!-- Шаг 2 -->
    <section id="step2" aria-label="Код/пароль" class="hidden" style="margin-top:20px;">
        <div class="form-group">
            <label for="code">Код из Telegram</label>
            <input id="code" type="text" inputmode="numeric" placeholder="12345"/>
        </div>

        <div id="pwdWrap" class="form-group hidden">
            <label for="password">Пароль 2FA</label>
            <input id="password" type="password" placeholder="••••••••"/>
        </div>

        <div class="buttons">
            <button class="btn-success" id="btnVerify">Подтвердить</button>
        </div>

        <div class="statusbar" id="s2status" data-state="info">Ожидание…</div>
    </section>
</div>

<div id="toasts" class="toasts"></div>
<div class="footer">TDLib Web • Авторизация</div>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
