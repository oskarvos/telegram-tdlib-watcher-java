<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>TDLib Авторизация</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/app.css"/>
    <style>
        body { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); }
        .container { max-width: 560px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Авторизация в Telegram</h1>


    <!-- Шаг 1 -->
    <div id="step1">
        <div class="form-group">
            <label>API ID</label>
            <input id="apiId" type="number" placeholder="Например, 123456"/>
        </div>
        <div class="form-group">
            <label>API HASH</label>
            <input id="apiHash" type="text" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"/>
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input id="phone" type="tel" placeholder="+375291234567"/>
        </div>
        <div class="form-group">
            <label><input id="useTestDc" type="checkbox"/> Использовать тестовый DC</label>
        </div>
        <div class="form-group">
            <label><input id="rememberCreds" type="checkbox"/> Запомнить введённые данные</label>
        </div>
        <div class="buttons">
            <button class="btn-primary" id="btnSendCode">Отправить код</button>
        </div>
        <div id="s1status" class="status"></div>
    </div>


    <hr style="margin:20px 0"/>


    <!-- Шаг 2 -->
    <div id="step2" class="hidden">
        <div class="form-group">
            <label>Код из Telegram</label>
            <input id="code" type="text" placeholder="12345"/>
        </div>
        <div id="pwdWrap" class="form-group hidden">
            <label>Пароль 2FA</label>
            <input id="password" type="password" placeholder="••••••••"/>
        </div>
        <div class="buttons">
            <button class="btn-primary" id="btnVerify">Подтвердить</button>
            <a class="btn-success" href="/app">Перейти в приложение</a>
        </div>
        <div id="s2status" class="status"></div>
    </div>
</div>


<div id="toasts" class="toasts"></div>
<div class="footer">TDLib Web • Авторизация</div>


<script type="module" src="/js/auth.js"></script>
</body>
</html>
